<!DOCTYPE html>
<html lang="en">
<head>

     <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">

<body>
    <nav id="nav"><a href="travel.html">←</a></nav>
<h1 id="heading">CONTACT US📩</h1>
    <hr>
    <br>
     <p>
            Have a question or want to share your travel experience?
        </p>

        <p>
            We'd love to hear from you! 🌍✈️
        </p>
    <form class="form">
<label id="name">NAME</label>
<input type="text" placeholder="enter your name" required>
<br><br>
<label id="email">
    EMAIL
</label>
<input type="email" placeholder="example123@gmail.com" required>
<br><br>
<label id="message">MESSAGE</label>
<textarea rows="5" placeholder="write your message......." required></textarea>
  <br><br>
  <button id="button">Send message</button>
    </form>
   </body>
